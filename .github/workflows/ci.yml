name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          locked: true
      - run: pixi run bun install --frozen-lockfile
      - run: pixi run prek run --all-files
      - run: pixi run bun run test
      - run: pixi run bun run build
